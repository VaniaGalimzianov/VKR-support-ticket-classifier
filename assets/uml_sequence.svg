<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1660" viewBox="0 0 1920 1660">\n<rect width="100%" height="100%" fill="white"/>\n<style>text{font-family:DejaVu Sans,Arial,sans-serif;fill:#172B4D}.title{font-size:25px;font-weight:bold}.part{font-size:16px;font-weight:bold}.msg{font-size:14px}.small{font-size:12px}.lifeline{stroke:#97A6B2;stroke-width:1.5;stroke-dasharray:7 6}.line{stroke:#52606D;stroke-width:2;fill:none}.ret{stroke:#52606D;stroke-width:1.8;stroke-dasharray:7 5;fill:none}.box{fill:#F6F8FA;stroke:#52606D;stroke-width:1.5}.alt{fill:#F8FAFC;stroke:#7B8794;stroke-width:1.5}.branch{fill:#EAF2FF;stroke:#52606D;stroke-width:1.3}</style>\n<text x="960" y="40" text-anchor="middle" class="title">Рисунок 6 — UML Sequence. Обработка обращения и выбор маршрута</text>\n<rect x="30" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="120" y="105" text-anchor="middle" class="part">Пользователь</text>\n<line x1="120" y1="130" x2="120" y2="1600" class="lifeline"/>\n<rect x="260" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="350" y="105" text-anchor="middle" class="part">Web / API</text>\n<line x1="350" y1="130" x2="350" y2="1600" class="lifeline"/>\n<rect x="490" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="580" y="105" text-anchor="middle" class="part">Контроль
доступа</text>\n<line x1="580" y1="130" x2="580" y2="1600" class="lifeline"/>\n<rect x="720" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="810" y="105" text-anchor="middle" class="part">Предобработка</text>\n<line x1="810" y1="130" x2="810" y2="1600" class="lifeline"/>\n<rect x="950" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="1040" y="105" text-anchor="middle" class="part">Классификатор</text>\n<line x1="1040" y1="130" x2="1040" y2="1600" class="lifeline"/>\n<rect x="1180" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="1270" y="105" text-anchor="middle" class="part">База данных</text>\n<line x1="1270" y1="130" x2="1270" y2="1600" class="lifeline"/>\n<rect x="1410" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="1500" y="105" text-anchor="middle" class="part">Маршрутизация</text>\n<line x1="1500" y1="130" x2="1500" y2="1600" class="lifeline"/>\n<rect x="1680" y="68" width="180" height="62" rx="8" class="box"/>\n<text x="1770" y="105" text-anchor="middle" class="part">Специалист</text>\n<line x1="1770" y1="130" x2="1770" y2="1600" class="lifeline"/>\n<line x1="120" y1="180" x2="350" y2="180" class="line"/>\n<polyline points="340,174 350,180 340,186" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="235.0" y="170" text-anchor="middle" class="msg">1. POST /tickets: текст обращения</text>\n<line x1="350" y1="250" x2="580" y2="250" class="line"/>\n<polyline points="570,244 580,250 570,256" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="465.0" y="240" text-anchor="middle" class="msg">2. Проверить токен и роль</text>\n<line x1="580" y1="290" x2="350" y2="290" class="ret"/>\n<polyline points="360,284 350,290 360,296" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="465.0" y="280" text-anchor="middle" class="msg">Доступ разрешён</text>\n<line x1="350" y1="360" x2="810" y2="360" class="line"/>\n<polyline points="800,354 810,360 800,366" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="580.0" y="350" text-anchor="middle" class="msg">3. Проверить обязательные поля и формат</text>\n<line x1="350" y1="430" x2="1270" y2="430" class="line"/>\n<polyline points="1260,424 1270,430 1260,436" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="810.0" y="420" text-anchor="middle" class="msg">4. Создать TICKET со статусом CLASSIFYING</text>\n<line x1="350" y1="500" x2="810" y2="500" class="line"/>\n<polyline points="800,494 810,500 800,506" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="580.0" y="490" text-anchor="middle" class="msg">5. Нормализовать текст; замаскировать ПДн</text>\n<line x1="810" y1="570" x2="1040" y2="570" class="line"/>\n<polyline points="1030,564 1040,570 1030,576" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="925.0" y="560" text-anchor="middle" class="msg">6. Передать очищенный текст модели</text>\n<line x1="1040" y1="640" x2="350" y2="640" class="ret"/>\n<polyline points="360,634 350,640 360,646" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="695.0" y="630" text-anchor="middle" class="msg">7. Категория, confidence, top-k, model_version / ошибка</text>\n<line x1="350" y1="710" x2="1270" y2="710" class="line"/>\n<polyline points="1260,704 1270,710 1260,716" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="810.0" y="700" text-anchor="middle" class="msg">8. Сохранить результат классификации, если он получен</text>\n<line x1="350" y1="780" x2="1500" y2="780" class="line"/>\n<polyline points="1490,774 1500,780 1490,786" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="925.0" y="770" text-anchor="middle" class="msg">9. Применить порог τ и правило категории</text>\n<rect x="270" y="830" width="1490" height="610" rx="10" class="alt"/>\n<path d="M 270 870 L 1760 870" stroke="#7B8794" stroke-width="1.4"/>\n<text x="290" y="857" class="part">alt — автоматическое назначение / ручная проверка</text>\n<rect x="300" y="895" width="1420" height="190" rx="8" class="branch"/>\n<text x="320" y="925" class="part">[confidence ≥ τ И правило маршрутизации активно]</text>\n<line x1="1500" y1="985" x2="1270" y2="985" class="ret"/>\n<polyline points="1280,979 1270,985 1280,991" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="1385.0" y="973" text-anchor="middle" class="msg">9a. Найти очередь и сохранить назначение AUTO</text>\n<rect x="300" y="1110" width="1420" height="300" rx="8" class="branch"/>\n<text x="320" y="1140" class="part">[confidence &lt; τ ИЛИ ошибка модели ИЛИ нет активного правила]</text>\n<line x1="1500" y1="1200" x2="1270" y2="1200" class="ret"/>\n<polyline points="1280,1194 1270,1200 1280,1206" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="1385.0" y="1188" text-anchor="middle" class="msg">9b. Установить статус NEEDS_REVIEW</text>\n<line x1="1500" y1="1260" x2="1770" y2="1260" class="line"/>\n<polyline points="1760,1254 1770,1260 1760,1266" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="1635.0" y="1248" text-anchor="middle" class="msg">9c. Передать в очередь ручной проверки</text>\n<line x1="1770" y1="1330" x2="1270" y2="1330" class="line"/>\n<polyline points="1280,1324 1270,1330 1280,1336" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="1520.0" y="1318" text-anchor="middle" class="msg">9d. Сохранить категорию, очередь и автора решения</text>\n<line x1="350" y1="1490" x2="1270" y2="1490" class="line"/>\n<polyline points="1260,1484 1270,1490 1260,1496" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="810.0" y="1480" text-anchor="middle" class="msg">10. Записать событие аудита и итоговое состояние</text>\n<line x1="350" y1="1560" x2="120" y2="1560" class="ret"/>\n<polyline points="130,1554 120,1560 130,1566" stroke="#52606D" stroke-width="2" fill="none"/>\n<text x="235.0" y="1550" text-anchor="middle" class="msg">11. Ответ: ID, статус и результат</text>\n<text x="960" y="1620" text-anchor="middle" class="small">Тикет сохраняется до вызова модели: сбой классификатора не приводит к потере обращения.</text>\n</svg>